---
- name: Baseline installer (macOS + Omarchy)
  hosts: all
  gather_facts: true
  connection: local

  vars:
    # --------------------------------------------------------------------------------
    #                             BASELINE INSTALL LISTS
    # --------------------------------------------------------------------------------
    # Declare lists per platform. Keep it boring and explicit.
    # Scripts are run LAST (after packages/casks).

    # macOS
    macos_brew:
      - yt-dlp
      - mpv
      - tmux
      - neovim
      - qutebrowser
      - netbirdio/tap/netbird

    macos_cask:
      - brave-browser

    macos_script: []
    # Example:
    # macos_script:
    #   - cmd: "curl -fsSL https://example/install.sh | sh"
    #     become: false

    # Omarchy
    omarchy_pacman:
      - yt-dlp
      - mpv
      - tmux
      - neovim
      - qutebrowser
      - netbird
      - curl

    omarchy_yay:
      - brave-bin

    omarchy_script: []
    # Example:
    # omarchy_script:
    #   - cmd: "curl -fsSL https://zed.dev/install.sh | sh"
    #     become: false

  pre_tasks:
    - name: "Preflight: assert env_platform is set"
      ansible.builtin.assert:
        that:
          - env_platform is defined
          - env_platform in ["macos", "omarchy"]
        fail_msg: "env_platform must be set per host to macos or omarchy."

  tasks:
    # =================================================================================
    #                                      macOS
    # =================================================================================
    # ---------------------------------------------------------------------------------
    #                              PREREQUISITES (macOS)
    # ---------------------------------------------------------------------------------
    - name: "macOS prerequisites: compute whether any installs are planned"
      ansible.builtin.set_fact:
        macos_has_work: "{{ (macos_brew | length) + (macos_cask | length) + (macos_script | length) > 0 }}"
      when: env_platform == "macos"

    - name: "macOS prerequisites: check Homebrew exists"
      ansible.builtin.command: brew --version
      register: brew_check
      changed_when: false
      failed_when: false
      when:
        - env_platform == "macos"
        - macos_has_work | bool

    - name: "macOS prerequisites: fail if brew missing"
      ansible.builtin.fail:
        msg: "Homebrew ('brew') is required but not installed."
      when:
        - env_platform == "macos"
        - macos_has_work | bool
        - brew_check.rc != 0

    - name: "macOS prerequisites: check curl exists (only if scripts planned)"
      ansible.builtin.command: curl --version
      register: macos_curl_check
      changed_when: false
      failed_when: false
      when:
        - env_platform == "macos"
        - (macos_script | length) > 0

    - name: "macOS prerequisites: fail if scripts planned but curl missing"
      ansible.builtin.fail:
        msg: "Script installs planned but 'curl' is missing."
      when:
        - env_platform == "macos"
        - (macos_script | length) > 0
        - (macos_curl_check.rc | default(1)) != 0

    # ---------------------------------------------------------------------------------
    #                              EARLY EXIT (macOS)
    # ---------------------------------------------------------------------------------
    - name: "macOS: nothing planned (skip)"
      ansible.builtin.debug:
        msg: "No macOS installs planned."
      when:
        - env_platform == "macos"
        - not (macos_has_work | bool)

    # ---------------------------------------------------------------------------------
    #                              INSTALLS (macOS)
    # ---------------------------------------------------------------------------------
    - name: "macOS: install brew formulae"
      ansible.builtin.command: "brew install {{ item | quote }}"
      changed_when: true
      loop: "{{ macos_brew }}"
      loop_control:
        label: "{{ item }}"
      when:
        - env_platform == "macos"
        - macos_has_work | bool
        - (macos_brew | length) > 0

    - name: "macOS: install casks"
      ansible.builtin.command: "brew install --cask {{ item | quote }}"
      changed_when: true
      loop: "{{ macos_cask }}"
      loop_control:
        label: "{{ item }}"
      when:
        - env_platform == "macos"
        - macos_has_work | bool
        - (macos_cask | length) > 0

    - name: "macOS: run script installs (LAST)"
      ansible.builtin.shell: |
        set -euo pipefail
        {{ item.cmd }}
      args:
        executable: /bin/bash
      become: "{{ (item.become | default(false)) | bool }}"
      changed_when: true
      loop: "{{ macos_script }}"
      loop_control:
        label: "{{ item.cmd }}"
      when:
        - env_platform == "macos"
        - macos_has_work | bool
        - (macos_script | length) > 0

    # =================================================================================
    #                                     OMARCHY
    # =================================================================================
    # ---------------------------------------------------------------------------------
    #                            PREREQUISITES (OMARCHY)
    # ---------------------------------------------------------------------------------
    - name: "Omarchy prerequisites: compute whether any installs are planned"
      ansible.builtin.set_fact:
        omarchy_has_work: "{{ (omarchy_pacman | length) + (omarchy_yay | length) + (omarchy_script | length) > 0 }}"
      when: env_platform == "omarchy"

    - name: "Omarchy prerequisites: verify pacman exists (fail fast)"
      ansible.builtin.command: pacman --version
      register: pacman_check
      changed_when: false
      failed_when: pacman_check.rc != 0
      when:
        - env_platform == "omarchy"
        - omarchy_has_work | bool

    - name: "Omarchy prerequisites: check curl exists (fail fast if scripts planned)"
      ansible.builtin.command: curl --version
      register: omarchy_curl_check
      changed_when: false
      failed_when: false
      when:
        - env_platform == "omarchy"
        - (omarchy_script | length) > 0

    - name: "Omarchy prerequisites: fail if scripts planned but curl missing"
      ansible.builtin.fail:
        msg: "Script installs planned but 'curl' is missing."
      when:
        - env_platform == "omarchy"
        - (omarchy_script | length) > 0
        - (omarchy_curl_check.rc | default(1)) != 0

    - name: "Omarchy prerequisites: check yay exists (only if yay installs planned)"
      ansible.builtin.command: yay --version
      register: yay_check
      changed_when: false
      failed_when: false
      when:
        - env_platform == "omarchy"
        - omarchy_has_work | bool
        - (omarchy_yay | length) > 0

    - name: "Omarchy prerequisites: fail if yay installs planned but yay missing"
      ansible.builtin.fail:
        msg: >-
          AUR installs planned (yay): {{ omarchy_yay }},
          but 'yay' is not available.
      when:
        - env_platform == "omarchy"
        - omarchy_has_work | bool
        - (omarchy_yay | length) > 0
        - (yay_check.rc | default(1)) != 0

    # ---------------------------------------------------------------------------------
    #                              EARLY EXIT (OMARCHY)
    # ---------------------------------------------------------------------------------
    - name: "Omarchy: nothing planned (skip snapshot + installs)"
      ansible.builtin.debug:
        msg: "No Omarchy installs planned (skip snapshot + installs)."
      when:
        - env_platform == "omarchy"
        - not (omarchy_has_work | bool)

    # ---------------------------------------------------------------------------------
    #                         SAFETY: SNAPSHOT BEFORE INSTALLS
    # ---------------------------------------------------------------------------------
    - name: "Omarchy: create system snapshot before installs"
      ansible.builtin.import_tasks: _preflight_omarchy_snapshot.yml
      when:
        - env_platform == "omarchy"
        - omarchy_has_work | bool

    # ---------------------------------------------------------------------------------
    #                              INSTALLS (OMARCHY)
    # ---------------------------------------------------------------------------------
    - name: "Omarchy: install pacman packages"
      become: true
      ansible.builtin.command: >-
        pacman -S --noconfirm --needed {{ omarchy_pacman | map('quote') | join(' ') }}
      changed_when: true
      when:
        - env_platform == "omarchy"
        - omarchy_has_work | bool
        - (omarchy_pacman | length) > 0

    - name: "Omarchy: install yay packages"
      ansible.builtin.command: >-
        yay -S --noconfirm --needed {{ omarchy_yay | map('quote') | join(' ') }}
      changed_when: true
      when:
        - env_platform == "omarchy"
        - omarchy_has_work | bool
        - (omarchy_yay | length) > 0
        - (yay_check.rc | default(1)) == 0

    - name: "Omarchy: run script installs (LAST)"
      ansible.builtin.shell: |
        set -euo pipefail
        {{ item.cmd }}
      args:
        executable: /bin/bash
      become: "{{ (item.become | default(false)) | bool }}"
      changed_when: true
      loop: "{{ omarchy_script }}"
      loop_control:
        label: "{{ item.cmd }}"
      when:
        - env_platform == "omarchy"
        - omarchy_has_work | bool
        - (omarchy_script | length) > 0
