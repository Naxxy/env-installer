---
- name: Baseline installer (macOS + Omarchy)
  hosts: all
  gather_facts: false

  # --------------------------------------------------------------------------------
  #                         BASELINE LISTS (VARS FILES)
  # --------------------------------------------------------------------------------
  # The baseline defaults live in:
  # - vars/macos.yml
  # - vars/omarchy.yml
  #
  # Host-level overrides live in inventory/host_vars/*.yml.

  vars_files:
    - ../vars/macos.yml
    - ../vars/omarchy.yml

  pre_tasks:
    - name: "Preflight: assert env_platform is set"
      ansible.builtin.assert:
        that:
          - env_platform is defined
          - env_platform in ["macos", "omarchy"]
        fail_msg: "env_platform must be set per host to macos or omarchy."

  tasks:
    # =================================================================================
    #                                      macOS
    # =================================================================================
    - name: "macOS: baseline installer"
      when: env_platform == "macos"
      block:

        # ---------------------------------------------------------------------------------
        #                     PLAN: BUILD EFFECTIVE LISTS (BASELINE + ADD - SKIP)
        # ---------------------------------------------------------------------------------
        - name: "macOS plan: compute effective install lists"
          ansible.builtin.set_fact:
            macos_brew_effective: >-
              {{
                (macos_brew | default([]))
                | union(env_macos_brew_add | default([]))
                | difference(env_macos_brew_skip | default([]))
              }}
            macos_cask_effective: >-
              {{
                (macos_cask | default([]))
                | union(env_macos_cask_add | default([]))
                | difference(env_macos_cask_skip | default([]))
              }}
            platform_script_effective: >-
              {{
                (macos_script | default([]))
                + (env_macos_script_add | default([]))
                | rejectattr('name', 'in', (env_macos_script_skip | default([])))
                | list
              }}

        - name: "macOS plan: debug effective lists"
          ansible.builtin.debug:
            msg:
              brew: "{{ macos_brew_effective }}"
              cask: "{{ macos_cask_effective }}"
              script_names: "{{ platform_script_effective | map(attribute='name') | list }}"
              total: >-
                {{
                  (macos_brew_effective | length)
                  + (macos_cask_effective | length)
                  + (platform_script_effective | length)
                }}

        - name: "macOS plan: compute whether any installs are planned"
          ansible.builtin.set_fact:
            platform_has_work: >-
              {{
                (macos_brew_effective | length)
                + (macos_cask_effective | length)
                + (platform_script_effective | length)
                > 0
              }}

        # ---------------------------------------------------------------------------------
        #                              EARLY EXIT (macOS)
        # ---------------------------------------------------------------------------------
        - name: "macOS: nothing planned (end host)"
          ansible.builtin.debug:
            msg: "No macOS installs planned. Ending host execution."
          when: not (platform_has_work | bool)

        - name: "macOS: end host (no work)"
          ansible.builtin.meta: end_host
          when: not (platform_has_work | bool)

        # ---------------------------------------------------------------------------------
        #                              PREREQUISITES (macOS)
        # ---------------------------------------------------------------------------------
        - name: "macOS prerequisites: check Homebrew exists"
          ansible.builtin.command: brew --version
          register: brew_check
          changed_when: false
          failed_when: false

        - name: "macOS prerequisites: fail if brew missing"
          ansible.builtin.fail:
            msg: "Homebrew ('brew') is required but not installed."
          when: brew_check.rc != 0

        # ---------------------------------------------------------------------------------
        #                              INSTALLS (macOS)
        # ---------------------------------------------------------------------------------
        - name: "macOS: install brew formulae"
          ansible.builtin.command: "brew install {{ item | quote }}"
          changed_when: true
          loop: "{{ macos_brew_effective }}"
          loop_control:
            label: "{{ item }}"
          when: (macos_brew_effective | length) > 0

        - name: "macOS: install casks"
          ansible.builtin.command: "brew install --cask {{ item | quote }}"
          changed_when: true
          loop: "{{ macos_cask_effective }}"
          loop_control:
            label: "{{ item }}"
          when: (macos_cask_effective | length) > 0

        # ---------------------------------------------------------------------------------
        #                         SCRIPT INSTALLS (macOS) — IDEMPOTENT
        # ---------------------------------------------------------------------------------
        - name: "macOS scripts: run installers when not already installed (LAST)"
          ansible.builtin.shell: |
            set -euo pipefail

            echo "---- {{ item.name }} ----"

            # ------------------------------------------------------------
            # PREREQUISITES (declared per script)
            # ------------------------------------------------------------
            {% if item.prereq_check is defined %}
            if ! ( {{ item.prereq_check }} ); then
              echo "Missing prerequisites for '{{ item.name }}'"
              exit 2
            fi
            {% endif %}

            # ------------------------------------------------------------
            # IDEMPOTENT CHECK
            # ------------------------------------------------------------
            if {{ item.idempotent_check }}; then
              echo "Already installed: {{ item.name }}"
              exit 0
            fi

            # ------------------------------------------------------------
            # INSTALL
            # ------------------------------------------------------------
            echo "Installing: {{ item.name }}"
            {{ item.cmd }}
          args:
            executable: /bin/bash
          become: "{{ (item.become | default(false)) | bool }}"
          register: macos_script_result
          changed_when: true
          loop: "{{ platform_script_effective }}"
          loop_control:
            label: "{{ item.name }}"
          when: (platform_script_effective | length) > 0


    # =================================================================================
    #                                     OMARCHY
    # =================================================================================
    - name: "Omarchy: baseline installer"
      when: env_platform == "omarchy"
      block:

        # ---------------------------------------------------------------------------------
        #                     PLAN: BUILD EFFECTIVE LISTS (BASELINE + ADD - SKIP)
        # ---------------------------------------------------------------------------------
        - name: "Omarchy plan: compute effective install lists"
          ansible.builtin.set_fact:
            omarchy_pacman_effective: >-
              {{
                (omarchy_pacman | default([]))
                | union(env_omarchy_pacman_add | default([]))
                | difference(env_omarchy_pacman_skip | default([]))
              }}
            omarchy_yay_effective: >-
              {{
                (omarchy_yay | default([]))
                | union(env_omarchy_yay_add | default([]))
                | difference(env_omarchy_yay_skip | default([]))
              }}
            platform_script_effective: >-
              {{
                (omarchy_script | default([]))
                + (env_omarchy_script_add | default([]))
                | rejectattr('name', 'in', (env_omarchy_script_skip | default([])))
                | list
              }}

        - name: "Omarchy plan: debug effective lists"
          ansible.builtin.debug:
            msg:
              pacman: "{{ omarchy_pacman_effective }}"
              yay: "{{ omarchy_yay_effective }}"
              script_names: "{{ platform_script_effective | map(attribute='name') | list }}"
              total: >-
                {{
                  (omarchy_pacman_effective | length)
                  + (omarchy_yay_effective | length)
                  + (platform_script_effective | length)
                }}

        - name: "Omarchy plan: compute whether any installs are planned"
          ansible.builtin.set_fact:
            platform_has_work: >-
              {{
                (omarchy_pacman_effective | length)
                + (omarchy_yay_effective | length)
                + (platform_script_effective | length)
                > 0
              }}

        # ---------------------------------------------------------------------------------
        #                              EARLY EXIT (OMARCHY)
        # ---------------------------------------------------------------------------------
        - name: "Omarchy: nothing planned (end host)"
          ansible.builtin.debug:
            msg: "No Omarchy installs planned (skip snapshot + installs). Ending host execution."
          when: not (platform_has_work | bool)

        - name: "Omarchy: end host (no work)"
          ansible.builtin.meta: end_host
          when: not (platform_has_work | bool)

        # ---------------------------------------------------------------------------------
        #                            PREREQUISITES (OMARCHY)
        # ---------------------------------------------------------------------------------
        - name: "Omarchy prerequisites: verify pacman exists (fail fast)"
          ansible.builtin.command: pacman --version
          register: pacman_check
          changed_when: false
          failed_when: pacman_check.rc != 0

        - name: "Omarchy prerequisites: check yay exists (only if yay installs planned)"
          ansible.builtin.command: yay --version
          register: yay_check
          changed_when: false
          failed_when: false
          when: (omarchy_yay_effective | length) > 0

        - name: "Omarchy prerequisites: fail if yay installs planned but yay missing"
          ansible.builtin.fail:
            msg: >-
              AUR installs planned (yay): {{ omarchy_yay_effective }},
              but 'yay' is not available.
          when:
            - (omarchy_yay_effective | length) > 0
            - (yay_check.rc | default(1)) != 0

        # ---------------------------------------------------------------------------------
        #                         SAFETY: SNAPSHOT BEFORE INSTALLS
        # ---------------------------------------------------------------------------------
        - name: "Omarchy: create system snapshot before installs"
          ansible.builtin.import_tasks: _preflight_omarchy_snapshot.yml

        # ---------------------------------------------------------------------------------
        #                              INSTALLS (OMARCHY)
        # ---------------------------------------------------------------------------------
        - name: "Omarchy: install pacman packages"
          become: true
          ansible.builtin.command: >-
            pacman -S --noconfirm --needed {{ omarchy_pacman_effective | map('quote') | join(' ') }}
          changed_when: true
          when: (omarchy_pacman_effective | length) > 0

        - name: "Omarchy: install yay packages"
          ansible.builtin.command: >-
            yay -S --noconfirm --needed {{ omarchy_yay_effective | map('quote') | join(' ') }}
          changed_when: true
          when:
            - (omarchy_yay_effective | length) > 0
            - (yay_check.rc | default(1)) == 0

        # ---------------------------------------------------------------------------------
        #                         SCRIPT INSTALLS (OMARCHY) — IDEMPOTENT
        # ---------------------------------------------------------------------------------
        - name: "Omarchy scripts: run installers when not already installed (LAST)"
          ansible.builtin.shell: |
            set -euo pipefail

            echo "---- {{ item.name }} ----"

            # ------------------------------------------------------------
            # PREREQUISITES (declared per script)
            # ------------------------------------------------------------
            {% if item.prereq_check is defined %}
            if ! ( {{ item.prereq_check }} ); then
              echo "Missing prerequisites for '{{ item.name }}'"
              exit 2
            fi
            {% endif %}

            # ------------------------------------------------------------
            # IDEMPOTENT CHECK
            # ------------------------------------------------------------
            if {{ item.idempotent_check }}; then
              echo "Already installed: {{ item.name }}"
              exit 0
            fi

            # ------------------------------------------------------------
            # INSTALL
            # ------------------------------------------------------------
            echo "Installing: {{ item.name }}"
            {{ item.cmd }}
          args:
            executable: /bin/bash
          become: "{{ (item.become | default(false)) | bool }}"
          register: omarchy_script_result
          changed_when: true
          loop: "{{ platform_script_effective }}"
          loop_control:
            label: "{{ item.name }}"
          when: (platform_script_effective | length) > 0
