---
# --------------------------------------------------------------------------------
#                         BASELINE LISTS — macOS
# --------------------------------------------------------------------------------
# These are the default “baseline” installs for macOS.
# Host-specific adds/skips are applied in playbooks/setup.yml.

macos_brew:
  - yt-dlp
  - mpv
  - tmux
  - neovim
  - qutebrowser
  - netbirdio/tap/netbird

macos_cask:
  - brave-browser

macos_script: []
