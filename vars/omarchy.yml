---
# --------------------------------------------------------------------------------
#                         BASELINE LISTS — OMARCHY
# --------------------------------------------------------------------------------
# These are the default “baseline” installs for Omarchy.
# Host-specific adds/skips are applied in playbooks/setup.yml.

omarchy_pacman:
  - yt-dlp
  - mpv
  - tmux
  - neovim
  - qutebrowser
  - netbird
  - curl

omarchy_yay:
  - brave-bin

omarchy_script: []
